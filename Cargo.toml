[package]
name = "pem-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.88" # keyring 4.x MSRV
description = "Zero-knowledge encryption and Google Drive backup for .pem private keys"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# CLI & async runtime
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
anyhow = "1.0"

# Cryptography & memory hygiene
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"                                    # OS CSPRNG: salts, nonces, PKCE verifier, OAuth state
zeroize = "1.9"
rpassword = "7.5"
region = "4.0"                                       # mlock/VirtualLock for secret buffers (safe API)

# OAuth2 (hand-rolled PKCE, see BACKLOG D5), HTTP & OS keychain
sha2 = "0.11"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form", "query"] }
keyring = "4.2"                                      # default "v1" feature = macOS/Windows/Secret Service backends
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webbrowser = "1.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }  # safe setrlimit / prctl for core-dump hardening

[dev-dependencies]
tempfile = "3.27"
wiremock = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
# Keep the default panic = "unwind": with "abort", Zeroizing destructors never run.

# Argon2id at 64 MiB is very slow unoptimized; optimize it in debug and test builds too.
[profile.dev.package.argon2]
opt-level = 3
